<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="350" viewBox="0 0 1120 350" role="img" aria-labelledby="title description">
  <title id="title">Fluxo de persistência de uma execução</title>
  <desc id="description">O ciclo é testado, gravado no SQLite e só então mostrado na interface; saídas legadas são opcionais.</desc>
  <rect width="1120" height="350" fill="#1e2024"/>
  <g font-family="Segoe UI, Arial, sans-serif" text-anchor="middle">
    <g fill="#30343a" stroke="#77a9ef" stroke-width="2">
      <rect x="35" y="95" width="190" height="105" rx="10"/>
      <rect x="280" y="95" width="210" height="105" rx="10"/>
      <rect x="535" y="95" width="235" height="105" rx="10"/>
      <rect x="820" y="95" width="265" height="105" rx="10"/>
      <rect x="280" y="245" width="270" height="80" rx="10"/>
    </g>
    <g fill="#f2f4f7" font-size="19" font-weight="600">
      <text x="130" y="142">Executar ciclo</text><text x="130" y="170" font-size="15" font-weight="400">DNS · Ping · TCP · DB</text>
      <text x="385" y="142">Transação SQLite</text><text x="385" y="170" font-size="15" font-weight="400">ciclo + cinco etapas</text>
      <text x="653" y="142">CSV/TXT contínuos</text><text x="653" y="170" font-size="15" font-weight="400">opcionais · aviso em falha</text>
      <text x="953" y="142">Atualizar UI</text><text x="953" y="170" font-size="15" font-weight="400">progresso após persistência</text>
      <text x="415" y="279">Histórico e exportação</text><text x="415" y="305" font-size="15" font-weight="400">leitura paginada do SQLite</text>
    </g>
    <g stroke="#77a9ef" stroke-width="4" fill="none" marker-end="url(#arrow)">
      <path d="M225 147 H270"/><path d="M490 147 H525"/><path d="M770 147 H810"/><path d="M385 200 V235"/>
    </g>
  </g>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#77a9ef"/></marker></defs>
</svg>
