name: CI and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: DBConnectionTester.sln
  DESKTOP_PROJECT: src/DBConnectionTester.Desktop/DBConnectionTester.Desktop.csproj
  CLI_PROJECT: src/DBConnectionTester.Cli/DBConnectionTester.Cli.csproj
  # Set this repository variable only after the owner reviews and accepts WiX's OSMF terms.
  DBCT_WIX_ACCEPT_EULA: ${{ vars.DBCT_WIX_ACCEPT_EULA }}

jobs:
  validate:
    name: Validate Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release-artifact-id: ${{ steps.release_bundle.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use semantic version format, for example 2.0.0."
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match VERSION v$version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          if ($env:DBCT_WIX_ACCEPT_EULA -ne "wix7") {
            throw "MSI build requires the owner's WiX OSMF acceptance in repository variable DBCT_WIX_ACCEPT_EULA. See docs/installation.md."
          }

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:SOLUTION
          if ($LASTEXITCODE -ne 0) { throw "Solution restore failed." }
          dotnet restore $env:DESKTOP_PROJECT -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "Desktop runtime restore failed." }
          dotnet restore $env:CLI_PROJECT -r win-x64
          if ($LASTEXITCODE -ne 0) { throw "CLI runtime restore failed." }

      - name: Check vulnerable packages
        run: dotnet list $env:SOLUTION package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build $env:SOLUTION -c Release --no-restore --warnaserror

      # The hosted desktop limits native window sizes. Keep resizing checks
      # active in the local suite; run all other UI and functional tests here.
      - name: Test (excluding interactive desktop resizing)
        run: dotnet test $env:SOLUTION -c Release --no-build --no-restore --verbosity minimal --filter "Category!=InteractiveDesktop"

      - name: Publish and validate release packages
        shell: pwsh
        run: ./build/Publish-Release.ps1 -NoRestore

      # Installs products only on this disposable hosted runner. Creates a temporary
      # non-administrator account to verify genuine per-user installation.
      - name: Validate installer lifecycle in disposable Windows
        shell: pwsh
        run: ./build/Test-InstallerLifecycle.ps1 -PayloadDirectory publish/complete -DisposableEnvironment

      - name: Retain installer diagnostic logs on failure
        timeout-minutes: 2
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: installer-diagnostics-${{ github.run_id }}
          path: C:/Users/Public/DBCTInstallerTests/**/*.log
          if-no-files-found: ignore
          retention-days: 1

      # Transfer the expected release files in one ZIP container. Compression is
      # disabled because the packages are already compressed.
      - name: Upload temporary release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_bundle
        uses: actions/upload-artifact@v7
        with:
          name: DBConnectionTester-v${{ steps.version.outputs.value }}-release-bundle
          path: |
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-framework-dependent.zip
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-framework-dependent.zip.sha256
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained.zip
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained.zip.sha256
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained.exe
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained.exe.sha256
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-portable-complete.zip
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-portable-complete.zip.sha256
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-portable-cli.zip
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-portable-cli.zip.sha256
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64.msi
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64.msi.sha256
            artifacts/SHA256SUMS.txt
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Checkout release asset contract
        uses: actions/checkout@v7

      - name: Download validated artifacts
        uses: actions/download-artifact@v7
        with:
          name: DBConnectionTester-v${{ needs.validate.outputs.version }}-release-bundle
          path: artifacts

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts -File)
          $expected = @(./build/Get-ReleaseAssetNames.ps1 -Version "${{ needs.validate.outputs.version }}")
          $difference = @(Compare-Object ($expected | Sort-Object) ($files.Name | Sort-Object))
          if ($difference.Count -ne 0) { throw "Release assets differ from the expected file list." }
          foreach ($line in Get-Content artifacts/SHA256SUMS.txt) {
            if ($line -notmatch '^([a-f0-9]{64})  (.+)$') { throw "Invalid checksum entry." }
            $expectedHash = $Matches[1]
            $assetName = $Matches[2]
            if ($assetName -notin $expected -or [IO.Path]::GetFileName($assetName) -ne $assetName) {
              throw "Unexpected checksum asset name."
            }
            $actualHash = (Get-FileHash -LiteralPath (Join-Path artifacts $assetName) -Algorithm SHA256).Hash.ToLowerInvariant()
            if ($actualHash -ne $expectedHash) { throw "Checksum mismatch: $assetName" }
          }
          gh release view $env:RELEASE_TAG 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG artifacts/* --clobber
          } else {
            gh release create $env:RELEASE_TAG artifacts/* `
              --title "DB Connection Tester $env:RELEASE_TAG" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed; retaining the temporary artifact." }

          $releaseJson = gh release view $env:RELEASE_TAG --json assets
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify published assets; retaining the temporary artifact." }
          $publishedAssets = ($releaseJson | ConvertFrom-Json).assets
          foreach ($file in $files) {
            $asset = @($publishedAssets | Where-Object { $_.name -eq $file.Name -and $_.size -eq $file.Length })
            if ($asset.Count -ne 1) { throw "Published asset missing or size mismatch: $($file.Name). Retaining the temporary artifact." }
          }

      # Delete only the bundle produced by this run, after publication and
      # asset verification succeed. Failed releases expire after one day.
      - name: Delete temporary release bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.validate.outputs.release-artifact-id }}
        run: |
          if ($env:ARTIFACT_ID -notmatch '^\d+$') { throw "Missing or invalid temporary artifact ID." }
          gh api --method DELETE "repos/$env:REPOSITORY/actions/artifacts/$env:ARTIFACT_ID"
          if ($LASTEXITCODE -ne 0) { throw "Unable to delete temporary artifact $env:ARTIFACT_ID." }
