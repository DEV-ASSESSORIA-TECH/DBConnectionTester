name: CI and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: DBConnectionTester.sln
  TEST_PROJECT: tests/DBConnectionTester.Tests/DBConnectionTester.Tests.csproj

jobs:
  validate:
    name: Validate Windows x64
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.value }}
      release-artifact-id: ${{ steps.release_bundle.outputs.artifact-id }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use semantic version format, for example 2.0.0."
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match VERSION v$version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:TEST_PROJECT
          dotnet restore DBConnectionTester.csproj -r win-x64

      - name: Check vulnerable packages
        run: dotnet list $env:TEST_PROJECT package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build $env:SOLUTION -c Release --no-restore --warnaserror

      # The hosted desktop limits native window sizes. Keep resizing checks
      # active in the local suite; run all other UI and functional tests here.
      - name: Test (excluding interactive desktop resizing)
        run: dotnet test $env:TEST_PROJECT -c Release --no-build --no-restore --verbosity minimal --filter "Category!=InteractiveDesktop"

      - name: Publish and validate release packages
        shell: pwsh
        run: ./build/Publish-Release.ps1 -NoRestore

      # Transfer the seven release files in one ZIP container. Compression is
      # disabled because the packages are already compressed.
      - name: Upload temporary release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        id: release_bundle
        uses: actions/upload-artifact@v7
        with:
          name: DBConnectionTester-v${{ steps.version.outputs.value }}-release-bundle
          path: |
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-framework-dependent.zip
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-framework-dependent.zip.sha256
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained.zip
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained.zip.sha256
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained.exe
            artifacts/DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained.exe.sha256
            artifacts/SHA256SUMS.txt
          archive: true
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write
      actions: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v7
        with:
          name: DBConnectionTester-v${{ needs.validate.outputs.version }}-release-bundle
          path: artifacts

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem -LiteralPath artifacts -File)
          if ($files.Count -ne 7) { throw "Expected seven release files, found $($files.Count)." }
          gh release view $env:RELEASE_TAG 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload $env:RELEASE_TAG artifacts/* --clobber
          } else {
            gh release create $env:RELEASE_TAG artifacts/* `
              --title "DB Connection Tester $env:RELEASE_TAG" `
              --generate-notes
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub Release publication failed; retaining the temporary artifact." }

          $releaseJson = gh release view $env:RELEASE_TAG --json assets
          if ($LASTEXITCODE -ne 0) { throw "Unable to verify published assets; retaining the temporary artifact." }
          $publishedAssets = ($releaseJson | ConvertFrom-Json).assets
          foreach ($file in $files) {
            $asset = @($publishedAssets | Where-Object { $_.name -eq $file.Name -and $_.size -eq $file.Length })
            if ($asset.Count -ne 1) { throw "Published asset missing or size mismatch: $($file.Name). Retaining the temporary artifact." }
          }

      # Delete only the bundle produced by this run, after publication and
      # asset verification succeed. Failed releases expire after one day.
      - name: Delete temporary release bundle
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          ARTIFACT_ID: ${{ needs.validate.outputs.release-artifact-id }}
        run: |
          if ($env:ARTIFACT_ID -notmatch '^\d+$') { throw "Missing or invalid temporary artifact ID." }
          gh api --method DELETE "repos/$env:REPOSITORY/actions/artifacts/$env:ARTIFACT_ID"
          if ($LASTEXITCODE -ne 0) { throw "Unable to delete temporary artifact $env:ARTIFACT_ID." }
