name: CI and release

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SOLUTION: DBConnectionTester.sln
  TEST_PROJECT: tests/DBConnectionTester.Tests/DBConnectionTester.Tests.csproj

jobs:
  validate:
    name: Validate Windows x64
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          $version = (Get-Content -Raw VERSION).Trim()
          if ($version -notmatch '^\d+\.\d+\.\d+$') {
            throw "VERSION must use semantic version format, for example 2.0.0."
          }
          if ("${{ github.ref_type }}" -eq "tag" -and "${{ github.ref_name }}" -ne "v$version") {
            throw "Tag ${{ github.ref_name }} does not match VERSION v$version."
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore $env:TEST_PROJECT
          dotnet restore DBConnectionTester.csproj -r win-x64

      - name: Check vulnerable packages
        run: dotnet list $env:TEST_PROJECT package --vulnerable --include-transitive --no-restore

      - name: Build
        run: dotnet build $env:SOLUTION -c Release --no-restore --warnaserror

      # The hosted desktop limits native window sizes. Keep resizing checks
      # active in the local suite; run all other UI and functional tests here.
      - name: Test (excluding interactive desktop resizing)
        run: dotnet test $env:TEST_PROJECT -c Release --no-build --no-restore --verbosity minimal --filter "Category!=InteractiveDesktop"

      - name: Publish and validate release packages
        shell: pwsh
        run: ./build/Publish-Release.ps1 -NoRestore

      - name: Upload framework-dependent package
        uses: actions/upload-artifact@v7
        with:
          name: DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-framework-dependent
          path: |
            artifacts/*-framework-dependent.zip
            artifacts/*-framework-dependent.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload self-contained package
        uses: actions/upload-artifact@v7
        with:
          name: DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained
          path: |
            artifacts/*-self-contained.zip
            artifacts/*-self-contained.zip.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload standalone executable
        uses: actions/upload-artifact@v7
        with:
          name: DBConnectionTester-v${{ steps.version.outputs.value }}-win-x64-self-contained-exe
          path: |
            artifacts/*-self-contained.exe
            artifacts/*-self-contained.exe.sha256
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload checksum manifest
        uses: actions/upload-artifact@v7
        with:
          name: DBConnectionTester-v${{ steps.version.outputs.value }}-checksums
          path: artifacts/SHA256SUMS.txt
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: validate
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Download validated artifacts
        uses: actions/download-artifact@v7
        with:
          pattern: DBConnectionTester-v*
          path: artifacts
          merge-multiple: true

      - name: Create or update GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "${{ github.ref_name }}" 2>$null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            gh release upload "${{ github.ref_name }}" artifacts/* --clobber
          } else {
            gh release create "${{ github.ref_name }}" artifacts/* `
              --title "DB Connection Tester ${{ github.ref_name }}" `
              --generate-notes
          }
